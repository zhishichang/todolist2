name: Deploy to Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./
          remote_path: ${{ secrets.SERVER_DEPLOY_PATH }}
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          excluded: |
            node_modules/
            .git/
            .env
            *.log
            .DS_Store
            client/src/
            client/node_modules/
            client/index.html
            client/vite.config.js
            client/tailwind.config.js
            client/postcss.config.js
            scripts/
            docs/

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export NODE_ENV=production
            cd "${{ secrets.SERVER_DEPLOY_PATH }}/server"
            npm install --production

            # === 诊断信息 ===
            echo "=== Diagnostic Info ==="
            echo "NODE_ENV=$NODE_ENV"
            echo ".env file exists: $(test -f .env && echo YES || echo NO)"
            echo ".env contents (redacted):"
            if [ -f .env ]; then
              sed 's/PASSWORD=.*/PASSWORD=***REDACTED***/' .env
            fi
            echo "MySQL status: $(systemctl is-active mysql)"
            echo "=== End Diagnostic ==="

            npx sequelize-cli db:migrate
            pm2 restart todolist-server
