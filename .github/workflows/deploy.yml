name: Deploy to Server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude=node_modules/
            --exclude=.git/
            --exclude=.env
            --exclude=server/.env
            --exclude=*.log
            --exclude=.DS_Store
            --exclude=client/src/
            --exclude=client/node_modules/
            --exclude=client/index.html
            --exclude=client/vite.config.js
            --exclude=client/tailwind.config.js
            --exclude=client/postcss.config.js
            --exclude=scripts/
            --exclude=docs/
          path: ./
          remote_path: ${{ secrets.SERVER_DEPLOY_PATH }}
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export NODE_ENV=production
            cd "${{ secrets.SERVER_DEPLOY_PATH }}/server"

            if [ ! -f .env ]; then
              echo "ERROR: .env file not found at $(pwd)/.env"
              echo "Please run init-server.sh on the server first."
              exit 1
            fi

            npm install --production
            npx sequelize-cli db:migrate

            if pm2 describe todolist-server > /dev/null 2>&1; then
              pm2 restart todolist-server
            else
              pm2 start ecosystem.config.js
            fi
